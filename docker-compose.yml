services:

  postgres:
    image: postgres:16
    container_name: greenrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: greenrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/init-user.sql:/docker-entrypoint-initdb.d/02-init-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greenrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    container_name: greenrack-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ai-service:
    build:
      context: ./system/ai-service
    container_name: greenrack-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: .
    container_name: greenrack-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:password@postgres:5432/greenrack
      AI_SERVICE_URL: http://ai-service:8000
      MQTT_BROKER: mqtt://mqtt:1883
      MQTT_TOPIC: greenrack/telemetry
      JWT_SECRET: greenrack-docker-development-secret
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
      ai-service:
        condition: service_healthy

  iot:
    build:
      context: ./iot-node
    container_name: greenrack-iot
    restart: unless-stopped
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: greenrack/telemetry
    depends_on:
      mqtt:
        condition: service_started
      backend:
        condition: service_started

volumes:
  postgres_data:
