# Servicio de IA (FastAPI + XGBoost + LSTM).
# Tarda en arrancar porque carga TensorFlow, por eso usa startupProbe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: greenrack
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      enableServiceLinks: false
      containers:
        - name: ai-service
          image: greenrack/ai-service:1.0
          imagePullPolicy: Always # toma siempre la última imagen construida en Docker Desktop
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30 # hasta 5 minutos para arrancar
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: greenrack
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
