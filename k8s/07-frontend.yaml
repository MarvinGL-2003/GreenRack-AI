# Frontend web (React + Vite servido por Nginx).
# 2 réplicas para demostrar escalabilidad; el Service reparte el tráfico.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: greenrack
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: greenrack/frontend:1.0
          imagePullPolicy: Always # toma siempre la última imagen construida en Docker Desktop
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: greenrack
spec:
  type: LoadBalancer # en Docker Desktop queda disponible en localhost:5173
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 80
